# Week 7's reading, recorded properly.
#
# One source in this week is used as a *stipulated model* rather than as
# evidence: Liu et al.'s positional finding supplies the shape of day 4's
# weighting, and the numbers are ours and are not measured. The claims below
# separate the two, and the week's fence forbids quoting a value.

system: Week 7 reading — reranking, diversity, budgets, and position

sources:
  - id: nogueira-2019
