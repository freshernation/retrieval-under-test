claims:
  - id: w7-cross-encoders-score-jointly
    text: >-
      Cross-encoder rerankers score query and passage jointly and are trained on
      large collections of human relevance judgments
    kind: known
    sources: [nogueira-2019]

  - id: w7-ltr-preceded-them
    text: >-
      Feature-based learning-to-rank preceded cross-encoders and used features of
      the query-document pair
    kind: known
    sources: [liu-ltr]

  - id: w7-reranking-helps-on-benchmarks
    text: >-
      Reranked pipelines improve over single-stage retrieval on several benchmark
      datasets
    kind: known
    sources: [beir-2021, nogueira-2019]

  - id: w7-mmr-parameter
    text: >-
      Maximal marginal relevance trades relevance against novelty with a single
      parameter
    kind: known
    sources: [carbonell-1998]

  - id: w7-standard-metrics-cannot-see-novelty
    text: >-
      Standard relevance metrics do not reward novelty; measuring diversity
      requires metrics designed for it, which need aspect-level judgments
    kind: known
    sources: [clarke-2008]

  - id: w7-position-effect
    text: >-
      Model performance on retrieving information from a long context is highest
      at the beginning and end and lowest in the middle, across several models
      and context lengths
    kind: known
    sources: [lost-in-the-middle]

  - id: w7-position-setup
    text: >-
      The positional finding was measured with a single answer-bearing document
      among distractors, at controlled positions, in a controlled multi-document
      QA setup
    kind: known
    sources: [lost-in-the-middle]

  - id: w7-answer-spans
    text: Answer spans as verbatim substrings are a standard ground-truth construction
    kind: known
    sources: [squad-2016]

  - id: w7-set-overlap
    text: Set-overlap similarity is the standard cheap document comparison
    kind: known
    sources: [broder-1997]

  - id: w7-bm25-is-derived
    text: >-
      BM25 derives from a probabilistic relevance model rather than being
      assembled from heuristics, which is what a hand-built feature reranker is
      competing against
    kind: known
    sources: [bm25-foundations]

  - id: w7-reranker-must-be-better
    text: >-
      A reranker helps only when it encodes more evidence about relevance than
      the retriever — through a richer view of the query-document pair, or more
      supervision — and a hand-built feature set has neither
    kind: inferred
    sources: [nogueira-2019, bm25-foundations, lin-neural-hype]
    note: Ours. Week 7 day 1's negative result is the evidence.

  - id: w7-shortlist-depth-from-ceiling
    text: >-
      Shortlist depth should be chosen from the ceiling curve rather than by
      convention, since a deeper shortlist beyond the point the ceiling flattens
      costs proportionally more for no additional headroom
    kind: inferred
    sources: [nogueira-2019]

  - id: w7-density-is-an-upper-bound
    text: >-
      Answer density is an upper bound on usefulness rather than a measure of it,
      because a chunk containing the span is counted whole
    kind: inferred
    sources: [squad-2016]

  - id: w7-stipulated-discipline
    text: >-
      A model whose parameters cannot be checked may be used to compare options
      but its values must not be reported, and the comparison must be shown
      invariant to the free parameter
    kind: inferred
    sources: [lost-in-the-middle]
    note: >-
      Ours. The same discipline weeks 3 and 4 applied to a k1 plateau and to chunk
      size, stated generally. Week 7's fence enforces it and the report template
      forbids quoting a stipulated score.

  - id: w7-position-size-unknown-per-system
    text: >-
      The size of the positional effect in a given RAG system is unknown without
      measuring it there, because prompt, window length, model and answer
      multiplicity all differ from the published setting
    kind: inferred
    sources: [lost-in-the-middle]

  - id: w7-reranking-ceiling
    text: >-
      Reranking cannot introduce a chunk the shortlist omitted, so answer recall
      at the shortlist depth bounds any reranked result at any k
    kind: derived

  - id: w7-identity-alpha
    text: >-
      If a reranker's best blend weight is the identity, its contribution at
      every other weight is negative
    kind: derived

  - id: w7-presence-metric-is-composition-blind
    text: >-
      A metric defined as "the answer is present in the top k" returns the same
      value for every arrangement of the non-answer results, so it is invariant
      to their redundancy
    kind: derived

  - id: w7-density-falls
    text: >-
      Once answered saturates, every additional word of context is
      non-answer-bearing, so density falls monotonically with budget
    kind: derived

  - id: w7-k-is-not-a-budget
    text: >-
      With chunks ranging from 100 to 300 words, a fixed k corresponds to a word
      budget varying by a factor of three across queries
    kind: derived

  - id: w7-skip-reorders-by-size
    text: >-
      Skipping a non-fitting chunk and taking a smaller one further down reorders
      the window by size rather than by rank
    kind: derived

  - id: w7-unknown-crossencoder-vs-tuned-hybrid
    text: >-
      How much of the published cross-encoder gain survives against a tuned hybrid
      baseline rather than a single-stage one
    kind: unknown

  - id: w7-unknown-diversity-value
    text: >-
      Whether diversity improves generated-answer quality on this corpus. It is
      measurable from week 8 and is what day 2 should motivate
    kind: unknown

  - id: w7-unknown-density-quality-link
    text: >-
      The relationship between answer density and generated-answer quality. We
      expect it to be strong and non-linear and have not measured it
    kind: unknown

  - id: w7-unknown-position-in-practice
    text: >-
      The position effect for the models, prompts and window sizes practitioners
      actually use. Measurable per system in an afternoon from week 8 onward
    kind: unknown
