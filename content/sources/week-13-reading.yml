claims:
  # ---- day 1
  - id: w13-at-least-once
    text: Standard message queues guarantee delivery at least once, not exactly once, and not in order
    kind: known
    sources: [sqs-at-least-once, kafka-semantics]
  - id: w13-naive-wrong
    text: >-
      Applying thirteen shuffled changes, two delivered twice, in arrival order gives
      the wrong final index in 19 of 20 deliveries; with per-document versions, in 0
    kind: derived
  # ---- day 2
  - id: w13-atomic-rename
    text: A rename onto an existing path on the same file system is atomic
    kind: known
    sources: [python-os-replace]
  - id: w13-analyzer-mismatch
    text: >-
      Querying a stopwords=None index with the default stoplist changes 19 of 26
      top tens and 6 top results, without an error
    kind: derived
  - id: w13-analyzers-must-match
    text: Query text and indexed text must be analysed compatibly or matches fail silently
    kind: inferred
    sources: [es-search-analyzer]
  # ---- day 3
  - id: w13-k1-inside-noise
    text: >-
      k1 = 2.0 raises MRR by 0.075 and lowers recall@3 by one query on 19 dev queries,
      both inside a tolerance of 0.08; an 8-dimension dense retriever loses 0.105 of recall@3
    kind: derived
  # ---- day 4
  - id: w13-202
    text: A 202 response means the request was accepted for processing that has not completed
    kind: known
    sources: [rfc-9110]
  - id: w13-not-yet-searchable
    text: A document answered 202 is not searchable until the queue is drained
    kind: derived
