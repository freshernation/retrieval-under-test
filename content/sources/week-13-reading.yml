# Week 13's reading, recorded properly.
#
# The week the system becomes a service: changes through a queue, an index on
# disk, a gate in CI, and a door with keys. The numbers are ours, measured on the
# gold corpus, and recorded as `derived`. The sourced claims are about how
# queues deliver, how a rename can be atomic, why analyzers must match, and what
# HTTP's 202 promises.

system: Week 13 reading — retrieval as a service

