# Week 12's reading, recorded properly.
#
# This is the week the corpus stops being frozen, readers stop being one person,
# and somebody other than the author gets to write a document. Almost every
# number in it is ours, measured on the gold corpus, and is recorded as
# `derived`. The sourced claims are the few facts about real systems the week
# leans on: how a production index deletes, what a cache key is, and what the
# published work on poisoned corpora found.
#
# The permissions in this week are stipulated, like week 7's positional model
# and week 8's generator: three RFCs are declared staff-only so that there is
# something to filter. Nothing about real access-control deployments is claimed
# from them.

system: Week 12 reading — a corpus that changes, readers who differ, documents that lie

sources:
  - id: lucene-indexreader
    title: "Apache Lucene 9.0 API — IndexReader"
    url: https://lucene.apache.org/core/9_0_0/core/org/apache/lucene/index/IndexReader.html
    publisher: Apache Software Foundation
    kind: documentation
    tier: 1
    published: 2021
    retrieved: 2026-10-14
    note: >-
      The `docFreq` contract: it does not take into account deleted documents
      that have not yet been merged away. The primary statement of day 1's
      finding, in the engine most search systems are built on.

  - id: es-merge
    title: "Elasticsearch reference — Merge"
    url: https://www.elastic.co/guide/en/elasticsearch/reference/current/index-modules-merge.html
    publisher: Elastic
    kind: documentation
    tier: 1
    undated: true
    retrieved: 2026-10-14
    conflict: true
    conflict_note: >-
      Published by the vendor. Cited only for how its own index behaves:
      segments are immutable and merging is what expunges deletes.

  - id: faiss-wiki
    title: "FAISS wiki — Special operations on indexes"
    url: https://github.com/facebookresearch/faiss/wiki/Special-operations-on-indexes
    publisher: Meta AI Research
    kind: documentation
    tier: 1
    undated: true
    retrieved: 2026-10-14
    conflict: true
    conflict_note: >-
      Published by the team that builds FAISS. Cited for the fact that vectors
      can be removed from and added to a built index, not for any claim about
      what that does to recall.

  - id: rfc-8259
    title: The JavaScript Object Notation (JSON) Data Interchange Format
    url: https://www.rfc-editor.org/rfc/rfc8259.html
    publisher: IETF
    author: Tim Bray (ed.)
    kind: standard
    tier: 1
    published: 2017
    retrieved: 2026-10-14
    note: >-
      Obsoletes RFC 7159. In the gold corpus it is the revised document day 2
      fingerprints against its predecessor.

  - id: rfc-9111
    title: HTTP Caching
    url: https://www.rfc-editor.org/rfc/rfc9111.html
    publisher: IETF
    author: Fielding, Nottingham and Reschke (eds.)
    kind: standard
    tier: 1
    published: 2022
    retrieved: 2026-10-14
    note: >-
      Defines what a cache key is made of and when a stored response may be
      reused for a different request. Day 3's cache leak is this question.

  - id: zanzibar-2019
    title: "Zanzibar: Google's Consistent, Global Authorization System"
    url: https://research.google/pubs/zanzibar-googles-consistent-global-authorization-system/
    publisher: USENIX ATC
    author: Pang et al.
    kind: paper
    tier: 1
    published: 2019
    retrieved: 2026-10-14
    note: >-
      A production system for storing and evaluating access control lists
      across many services. Cited for the fact that permissions are a separate
      system with their own consistency problem.

  - id: owasp-llm08
    title: "OWASP Top 10 for LLM Applications 2025 — LLM08: Vector and Embedding Weaknesses"
    url: https://genai.owasp.org/llmrisk/llm082025-vector-and-embedding-weaknesses/
    publisher: OWASP
    kind: standard
    tier: 2
    published: 2025
    retrieved: 2026-10-14
    note: >-
      Names unauthorised access through misaligned access controls, and data
      poisoning, as risks of retrieval systems specifically.

  - id: owasp-llm01
    title: "OWASP Top 10 for LLM Applications 2025 — LLM01: Prompt Injection"
    url: https://genai.owasp.org/llmrisk/llm01-prompt-injection/
    publisher: OWASP
    kind: standard
    tier: 2
    published: 2025
    retrieved: 2026-10-14
    note: The direct and indirect forms of prompt injection.

  - id: poisonedrag-2024
    title: "PoisonedRAG: Knowledge Corruption Attacks to Retrieval-Augmented Generation of Large Language Models"
    url: https://arxiv.org/abs/2402.07867
    publisher: arXiv
    author: Zou, Geng, Wang and Jia
    kind: paper
    tier: 1
    published: 2024
    retrieved: 2026-10-14
    note: >-
      Reports a 90% attack success rate from five injected texts per target
      question in a knowledge database of millions, and that the defences it
      evaluated were insufficient.

  - id: greshake-2023
    title: "Not what you've signed up for: Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection"
    url: https://arxiv.org/abs/2302.12173
    publisher: arXiv
    author: Greshake et al.
    kind: paper
    tier: 1
    published: 2023
    retrieved: 2026-10-14
    note: >-
      Introduces indirect prompt injection: instructions placed in data an
      application will later retrieve.

claims:
  # ---- day 1
  - id: w12-deletes-are-marks
    text: >-
      In Lucene-based engines a delete marks a document rather than removing it;
      segments are immutable and deleted documents are expunged when segments
      are merged
    kind: known
    sources: [es-merge, lucene-indexreader]

  - id: w12-docfreq-counts-the-dead
    text: >-
      Lucene's document frequency does not take into account deleted documents
      that have not yet been merged away, so term statistics include them
    kind: known
    sources: [lucene-indexreader]

  - id: w12-tombstone-drift
    text: >-
      Tombstoning the 28 chunks of the two obsoleted RFCs in a 266-chunk index
      changes the top-10 of 8 of 20 dev queries and the top-5 of 4, against an
      index built from the live chunks, and changes no top-1
    kind: derived

  - id: w12-json-df
    text: >-
      The term `json` has document frequency 32 in the tombstoned index and 16
      in the rebuilt one
    kind: derived

  - id: w12-debt-is-not-drift
    text: >-
      The fraction of dead documents measures how much could have drifted, not
      how much did; 10.5% debt produced 40% drift at depth ten
    kind: inferred
    sources: [lucene-indexreader]

  - id: w12-when-to-compact
    text: >-
      What debt threshold should trigger compaction on a corpus of realistic
      size, and whether drift grows linearly with debt. One corpus and one
      deletion pattern do not say
    kind: unknown

  # ---- day 2
  - id: w12-revision-reuse
    text: >-
      RFC 8259 revises RFC 7159; of its 21 section chunks, 2 have text identical
      to a chunk of its predecessor
    kind: derived

  - id: w12-rfc8259-obsoletes
    text: RFC 8259 obsoletes RFC 7159
    kind: known
    sources: [rfc-8259]

  - id: w12-unseen-terms
    text: >-
      The 39 chunks of the two arriving RFCs contain 161 terms absent from a
      vocabulary fitted without them
    kind: derived

  - id: w12-fold-in-agreement
    text: >-
      Folding the arriving chunks into the old basis and refitting the basis on
      the whole corpus return identical top-5 lists for 5 of 20 dev queries;
      the arriving documents reach the top 5 for 10 queries folded in and 6
      refitted
    kind: derived

  - id: w12-vectors-can-be-added
    text: >-
      A built vector index supports adding and removing vectors without being
      rebuilt
    kind: inferred
    sources: [faiss-wiki]

  - id: w12-fold-in-transfers
    text: >-
      Whether the fold-in gap seen with a corpus-fitted basis says anything
      about a frozen neural embedding model, which has no corpus-specific
      vocabulary. The direction may transfer; the size does not
    kind: unknown

  # ---- day 3
  - id: w12-post-filter-shortfall
    text: >-
      With three of ten documents restricted, post-filtering the top 5 for a
      public reader returns fewer than 5 results for 11 of 20 dev queries and
      none for 5; over-fetching 20 removes the shortfall; filtering before
      retrieval leaves 2 short
    kind: derived

  - id: w12-cache-leak
    text: >-
      A cache keyed on the query text alone, filled by a staff reader, serves a
      public reader a restricted chunk for 11 of 20 dev queries
    kind: derived

  - id: w12-cache-key
    text: >-
      A cache may reuse a stored response only for a request that matches its
      cache key, and what goes into the key is specified rather than assumed
    kind: known
    sources: [rfc-9111]

  - id: w12-acl-is-a-system
    text: >-
      Access control lists at scale are stored and evaluated by a dedicated
      system, with consistency between a permission change and its enforcement
      as a design problem
    kind: known
    sources: [zanzibar-2019]

  - id: w12-misaligned-access
    text: >-
      Inadequate or misaligned access controls in a retrieval system are a
      recognised route to unauthorised access and data leakage
    kind: inferred
    sources: [owasp-llm08]

  - id: w12-fail-closed
    text: >-
      That a document with no recorded permission must be treated as
      unreadable. Ours, as a rule for this pipeline
    kind: inferred
    sources: [owasp-llm08]

  - id: w12-revocation-lag
    text: >-
      How long a revoked permission survives in the caches of a typical
      deployed retrieval system. We have no measurement
    kind: unknown

  # ---- day 4
  - id: w12-targeted-poison
    text: >-
      One planted chunk that repeats the question, added to 266, reaches the
      context and is quoted in the answer for 20 of 20 dev queries when aimed
      at each in turn
    kind: derived

  - id: w12-checks-pass
    text: >-
      The answer drawn from the planted chunk has faithfulness 1.0, and every
      citation resolves and is in context
    kind: derived

  - id: w12-blanket-poison
    text: >-
      A single 366-word chunk containing all twenty planted sentences reaches
      the context for 14 of 20 dev queries
    kind: derived

  - id: w12-poisonedrag
    text: >-
      Injecting five malicious texts per target question into a knowledge
      database of millions of texts achieved a 90% attack success rate, and the
      defences evaluated were insufficient
    kind: known
    sources: [poisonedrag-2024]

  - id: w12-indirect-injection
    text: >-
      Instructions can be placed in data that an application later retrieves,
      and act on the model that reads them
    kind: known
    sources: [greshake-2023]

  - id: w12-poisoning-is-listed
    text: Data poisoning is a recognised risk of retrieval-augmented systems
    kind: inferred
    sources: [owasp-llm08, owasp-llm01]

  - id: w12-grounding-is-not-trust
    text: >-
      That grounding checks measure whether an answer follows from its context
      and cannot measure whether the context should be believed. Ours; the
      fourth instance of an aggregate that cannot see the member that matters
    kind: inferred
    sources: [poisonedrag-2024]

  - id: w12-obeying
    text: >-
      How often a given production model follows an instruction found in a
      retrieved chunk. The stipulated generator quotes and does not obey, so
      this course does not measure it
    kind: unknown
