claims:
  - id: w14-guard-false-positives
    text: >-
      On 1,000 random sixteen-digit order references a card pattern flags 1,000, the
      Luhn check 80, and Luhn with an issuer prefix 18; all 12 published test cards
      are caught by all three
    kind: derived
  - id: w14-luhn-one-in-ten
    text: A random number passes the Luhn check about one time in ten
    kind: inferred
    sources: [luhn-wikipedia]
  - id: w14-semantic-near-miss
    text: >-
      "section 3.2" and "section 3.4" of RFC 3986 score 0.981 by week 5's embedding,
      above nine of ten paraphrases; requiring identical identifiers removes every
      near miss at 0.8 and keeps all five paraphrase hits
    kind: derived
  - id: w14-graph-cost
    text: >-
      On 266 chunks, HNSW with M = 8 computes 241 distances per query for recall@10
      0.992 and 274 for 1.0; at 2,000 random vectors, M = 16, it reaches 0.978 with
      about a third of a scan
    kind: derived
  - id: w14-hnsw-algorithm
    text: HNSW searches greedily through layers of navigable small-world graphs controlled by M and ef
    kind: known
    sources: [hnsw-paper]
  - id: w14-shard-drift
    text: >-
      Four shards scoring with local statistics change 25 of 26 top tens and 5 top
      results; with shared statistics, none
    kind: derived
  - id: w14-dfs
    text: Gathering term statistics from every shard before scoring makes sharded BM25 match a single index
    kind: known
    sources: [es-search-type, es-bm25-shards]
