# Week 9's reading, recorded properly.
#
# The judge is a stipulated model, like week 8's generator. Its behaviours come
# from the literature below; its implementation is ours. Every claim about what
# real judges do cites a source; every number the simulator produces is derived
# and the fence forbids reporting a judge score without its baseline.

system: Week 9 reading — serving-time proxies, LLM-as-judge, power, and gates

sources:
  - id: zheng-2023
    title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena"
    url: https://arxiv.org/abs/2306.05685
    publisher: arXiv
    author: Zheng et al.
    kind: paper
    tier: 1
    published: 2023
    retrieved: 2026-09-10
    note: >-
      Position bias, verbosity bias, self-enhancement, and judge-human agreement
      rates. The foundational study for the whole day-2 lab.

  - id: wang-2023
    title: Large Language Models are not Fair Evaluators
    url: https://arxiv.org/abs/2305.17926
    publisher: arXiv
    author: Wang et al.
    kind: paper
    tier: 1
    published: 2023
    retrieved: 2026-09-10
    note: Position bias measured, and the both-orders mitigation.

  - id: ragas-2023
    title: "RAGAS: Automated Evaluation of Retrieval Augmented Generation"
    url: https://arxiv.org/abs/2309.15217
    publisher: arXiv
    author: Es, James, Espinosa-Anke and Schockaert
    kind: paper
    tier: 1
    published: 2023
    retrieved: 2026-09-10
