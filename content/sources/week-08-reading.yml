claims:
  - id: w8-rag-conditions-on-passages
    text: >-
      The retrieval-augmented architecture conditions generation on retrieved
      passages
    kind: known
    sources: [rag-2020]

  - id: w8-answer-spans
    text: Answer spans as verbatim substrings are a standard ground-truth construction
    kind: known
    sources: [squad-2016]

  - id: w8-unanswerable-is-harder
    text: >-
      Unanswerable questions require explicit handling and are substantially
      harder than answerable ones
    kind: known
    sources: [squad2-2018]

  - id: w8-answering-without-support-is-default
    text: >-
      Producing fluent output unsupported by the provided context is a documented
      default behaviour of generation systems
    kind: known
    sources: [ji-2022]

  - id: w8-intrinsic-extrinsic
    text: >-
      Hallucination is standardly divided into intrinsic — contradicting the
      provided context — and extrinsic, adding what the context does not contain
    kind: known
    sources: [ji-2022]

  - id: w8-attribution-is-to-a-source
    text: >-
      Attribution is defined as a relation between a claim and an identified
      source, not between a claim and the truth
    kind: known
    sources: [rashkin-2021]

  - id: w8-deployed-citations-are-unreliable
    text: >-
      Human evaluation of deployed generative search engines finds a substantial
      fraction of generated sentences not fully supported by the sources they cite
    kind: known
    sources: [liu-verifiability-2023]

  - id: w8-ragas-uses-a-model
    text: >-
      The widely used RAG faithfulness metric decomposes an answer into claims
      and uses a language model to judge each against the context
    kind: inferred
    sources: [ragas-2023]
    note: >-
      Caught by tools/check_sources.py, and the checker was right. That RAGAS
      computes faithfulness this way is self-description from a Tier 1 source and
      is not in doubt; that it is the *standard* or *widely used* approach is our
      characterisation of the field, resting on one source published by the
      framework's own authors. The mechanism is known; the prevalence is inferred.

  - id: w8-models-self-assess
    text: >-
      Language models can self-assess the correctness of their own answers with
      better-than-chance calibration
    kind: inferred
    sources: [kadavath-2022]
    note: >-
      Downgraded from known: the source evaluates its publisher's own models and
      we have found no independent replication at comparable scale. The existence
      of the signal is not in serious dispute; its magnitude is a vendor claim.

  - id: w8-rfc-citation-convention
    text: RFCs cite one another using bracketed reference tags, by published convention
    kind: known
    sources: [rfc7322]

  - id: w8-json-rule-changed
    text: >-
      RFC 8259 requires UTF-8 and obsoletes RFC 7159, which permitted UTF-16 and
      UTF-32; a published RFC is never revised, so 7159 carries no record of its
      own supersession
    kind: known
    sources: [rfc8259, rfc7159, rfc2026]

  - id: w8-no-tell
    text: >-
      A confidently wrong RAG answer is not distinguishable from a correct one by
      reading it
    kind: inferred
    sources: [ji-2022, liu-verifiability-2023]
    note: >-
      Week 1 asserted it; week 8 demonstrates it on this corpus with this
      simulator. The generalisation to real models rests on the cited literature
      rather than on anything measured here.

  - id: w8-faithfulness-is-not-correctness
    text: >-
      A perfectly faithful answer to a context that does not contain the answer is
      wrong, so faithfulness cannot support a claim about correctness
    kind: inferred
    sources: [rashkin-2021, ji-2022]
    note: Ours, and week 8's keystone. Follows from attribution being a relation to a source.

  - id: w8-superseded-undetectable-by-faithfulness
    text: >-
      No faithfulness metric can detect an answer faithfully drawn from a
      superseded source, because the disqualifying fact is absent from both the
      answer and the cited passage
    kind: inferred
    sources: [rfc2026, rashkin-2021]

  - id: w8-checker-false-positives
    text: >-
      A citation parser matching any bracketed token counts a corpus's own
      reference tags as model citations, producing fabrication findings for a
      generator that fabricated nothing
    kind: derived

  - id: w8-citation-attaches-to-previous-sentence
    text: >-
      A citation marker following sentence-final punctuation is assigned to the
      next sentence by any naive splitter, misattributing every citation in an
      answer
    kind: derived

  - id: w8-denominator
    text: >-
      A rate whose denominator is the answered queries rises when a system refuses
      more, independently of any change in answer quality
    kind: derived

  - id: w8-overlap-rewards-copying
    text: >-
      A word-overlap support metric scores verbatim copying at 1.0 and correct
      paraphrase lower, so it rewards the behaviour least wanted
    kind: derived

  - id: w8-refusal-overlap
    text: >-
      When the confidence distributions of answer-present and answer-absent
      queries overlap, no threshold both keeps every correct answer and refuses
      every wrong one
    kind: derived

  - id: w8-free-refusal-region
    text: >-
      On this corpus, refusal up to a confidence threshold of 0.55 removes two
      confidently-wrong answers while keeping every correct one
    kind: derived

  - id: w8-grounded-rate-is-blind-to-generation
    text: >-
      Groundedness measures retrieval, so it is unchanged by any generation fault
      including systematic misattribution
    kind: derived

  - id: w8-unknown-production-wrong-rate
    text: >-
      What fraction of production RAG answers are confident responses to
      unretrieved questions. Measurable with answer spans; we have not seen it
      published
    kind: unknown

  - id: w8-unknown-proxy-vs-judge
    text: >-
      How much a word-overlap support proxy disagrees with a model judge on real
      answers. Week 9's first experiment
    kind: unknown

  - id: w8-unknown-simulator-transfer
    text: >-
      Which of week 8's comparisons survive contact with a real model. Testable
      from week 10 and worth doing deliberately
    kind: unknown

  - id: w8-unknown-threshold-practice
    text: >-
      How refusal thresholds are set in deployed systems. Every practitioner we
      have asked says "the default", which is to refuse nothing
    kind: unknown
