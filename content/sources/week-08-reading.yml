# Week 8's reading, recorded properly.
#
# The generator this week is a *stipulated model* — see
# content/week-08/day-1/a-stipulated-generator.md. Its behaviours are drawn from
# the hallucination and attribution literature below; its implementation is a
# hundred lines of rules written for this course. Every claim about what a real
# model does cites a source; every number produced by the simulator is marked
# derived and the fence forbids treating it as an estimate of answer quality.

system: Week 8 reading — generation, grounding, citation, faithfulness and refusal

