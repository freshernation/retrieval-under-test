# Week 5's reading, recorded properly.
#
# Note what this file has to be honest about: the technique the labs build is
# not the technique the field uses. Latent semantic analysis is the direct
# ancestor of modern embeddings and it is a 1990 method fitted on 266 chunks.
# The claims below separate what the labs demonstrate from what is asserted
# about trained models, and day 3's second article does the same for students.

system: Week 5 reading — vector space, dimensionality reduction, comparison, and ANN

sources:
