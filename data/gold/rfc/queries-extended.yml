# The extended query set: 26 queries, 20 dev / 6 test.
#
# The sixteen from `queries.yml`, plus ten more dev queries added in week 6.
#
# Why a second file rather than an edit: weeks 1 to 5 measured a great many
# things against the sixteen-query set, and changing it underneath them would
# silently invalidate every number in those weeks. An eval set is an instrument;
# growing one is a new instrument, not a corrected one, and results taken with
# the two are not comparable. Keeping both files is what makes that visible.
#
# Load it explicitly:
#
#     queries = raglab.judgments.load(file="queries-extended.yml")
#
# From week 6 onward this is the set the labs use.

queries:

  # ---------------------------------------------------------------- dev

  - id: r01
    family: plain
    text: what status code should I return when a client sends too many requests
    split: dev
    note: The control. A plain lookup with one obviously correct answer.
    answer_spans:
      - "The 429 status code indicates that the user has sent too many requests in a given amount of time"
    judgments:
      rfc-6585: 3
      rfc-9309: 1
      rfc-7725: 0
      rfc-2324: 0

  - id: r02
    family: vocabulary-gap
    text: how do I tell a client to slow down
    split: dev
    note: >-
      Vocabulary gap. "Slow down" appears nowhere in the corpus. The answer is
      429 plus Retry-After, and the words for it are "Too Many Requests" and
      "rate limiting" — the latter only once, in parentheses, in RFC 6585 §4.
      A lexical retriever cannot do this query and week 5 is where you find out
      whether embeddings can.
    answer_spans:
      - "MAY include a Retry-After header indicating how long to wait before making a new request"
    judgments:
      rfc-6585: 3
      rfc-9309: 1
      rfc-3986: 0
      rfc-6265: 0

  - id: r03
    family: identifier
    text: "451"
    split: dev
    note: >-
      A bare identifier, and the query where dense retrieval will embarrass
      itself in week 5. "451" appears thirteen times in RFC 7725 and nowhere
      else in the corpus.
    answer_spans:
      - "451 Unavailable For Legal Reasons"
    judgments:
      rfc-7725: 3
      rfc-6585: 0
      rfc-3986: 0

  - id: r04
    family: identifier
    text: what does the 418 status code mean
    split: dev
    note: >-
      Correct answer, dubious authority. RFC 2324 defines 418 and was published
      on 1 April 1998 as a joke. The retrieval is right; whether the document
      belongs in the corpus at all is a station 1 question, and it is the most
      productive argument this corpus starts.
    answer_spans:
      - "Any attempt to brew coffee with a teapot should result in the error code"
    judgments:
      rfc-2324: 3
      rfc-6585: 0
      rfc-7725: 0

  - id: r05
    family: superseded
    text: must JSON be encoded in UTF-8
    split: dev
    note: >-
      **The most important query in the set.** Two documents, same title, same
      author, three years apart, and they disagree:
        RFC 7159 §8.1 (2014) — "JSON text SHALL be encoded in UTF-8, UTF-16, or UTF-32"
        RFC 8259 §8.1 (2017) — "MUST be encoded using UTF-8"
      RFC 8259 says "Obsoletes: 7159" in its header. **RFC 7159 does not say it
      has been obsoleted, because RFCs are never edited after publication.** The
      fact that makes one of these answers wrong exists only in the other
      document. Nothing in 7159 will ever tell your retriever, or your user.
      Graded 1 rather than 0 deliberately: it is squarely about the question and
      it is out of date, which is the most dangerous result a corpus can return.
    answer_spans:
      - "MUST be encoded using UTF-8"
    judgments:
      rfc-8259: 3
      rfc-7159: 1
      rfc-3986: 0
      rfc-9309: 0

  - id: r06
    family: acronym
    text: what does ABNF stand for
    split: dev
    note: >-
      Acronym expansion. Three documents spell out "Augmented Backus-Naur Form"
      exactly once each, in a reference; five use "ABNF" without expanding it.
      No document is *about* ABNF, so nothing earns a 3 — the corpus answers the
      question in passing and the honest maximum is 2.
    answer_spans:
      - "Augmented Backus-Naur Form (ABNF) notation"
    judgments:
      rfc-3986: 2
      rfc-6265: 2
      rfc-9309: 2
      rfc-8259: 1
      rfc-7725: 0

  - id: r07
    family: superseded
    text: where do well-known URIs live
    split: dev
    note: >-
      The second supersession pair, and it behaves differently from r05. RFC
      8615 obsoletes RFC 5785, but the answer — the "/.well-known/" path prefix
      — did not change. So the superseded document is outdated without being
      wrong, which is grade 2, not 1. Compare with r05 and be able to say why
      the grades differ.
    answer_spans:
      - "whose path component begins with the characters \"/.well-known/\""
    judgments:
      rfc-8615: 3
      rfc-5785: 2
      rfc-3986: 1
      rfc-9309: 0

  - id: r08
    family: plain
    text: what must a crawler do if robots.txt returns a 500 error
    split: dev
    note: >-
      Precise, and answered precisely — RFC 9309 §2.3.1.4: "the crawler MUST
      assume complete disallow". A good query for week 4, because the answer is
      two sentences buried in a section heading structure that chunking will
      either preserve or destroy.
    answer_spans:
      - "the crawler MUST assume complete disallow"
    judgments:
      rfc-9309: 3
      rfc-6585: 1
      rfc-7725: 0

  - id: r09
    family: vocabulary-gap
    text: how do I make a cookie expire
    split: dev
    note: >-
      Another vocabulary gap, milder than r02. The user says "expire"; RFC 6265
      says "Expires" and "Max-Age", so the lexical match is partial and lucky.
    answer_spans:
      - "The Max-Age attribute indicates the maximum lifetime of the cookie"
    judgments:
      rfc-6265: 3
      rfc-3986: 0
      rfc-8615: 0

  - id: r10
    family: out-of-scope
    text: how do I configure OAuth scopes for my API
    split: dev
    unanswerable: true
    note: >-
      **Out of scope, on purpose, and there is a trap in it.** Nothing in this
      corpus is about OAuth. But "OAuth" does appear three times in RFC 6585 —
      entirely in its bibliography, as a citation to a work in progress. So a
      lexical retriever returns a confident top result for a question the corpus
      cannot answer, and the passage it returns is a reference list.
      This is what every hallucination you will see in week 8 looks like from the
      retrieval side. Graded 1, because a bibliography entry is genuinely related
      and genuinely useless.
    judgments:
      rfc-6585: 1
      rfc-3986: 0
      rfc-8615: 0
      rfc-6265: 0


  # ------------------------------------------------- dev, added in week 6
  #
  # Ten more dev queries, written because week 5 could not measure what week 6
  # is about. On nine answerable queries the fusion headroom between lexical and
  # dense retrieval was zero at every k — not because the two are redundant, but
  # because complementarity involving one or two queries in each direction is
  # invisible at that sample size.
  #
  # This is the course taking its own advice, on schedule, having hit exactly the
  # wall week 3's milestone warned about. They are chosen to stress the two
  # retrievers in opposite directions: bare identifiers, which lexical retrieval
  # is not merely competitive on but correct, and paraphrases sharing almost no
  # vocabulary with the corpus.

  - id: r17
    family: identifier
    text: "428"
    split: dev
    answer_spans:
      - "The 428 status code indicates that the origin server requires the request to be conditional"
    judgments:
      rfc-6585: 3
      rfc-7725: 0
      rfc-2324: 0

  - id: r18
    family: identifier
    text: 431 request header fields too large
    split: dev
    answer_spans:
      - "The 431 status code indicates that the server is unwilling to process the request because its header fields are too large"
    judgments:
      rfc-6585: 3
      rfc-6265: 1
      rfc-3986: 0

  - id: r19
    family: paraphrase
    text: how do I stop search engines indexing my site
    split: dev
    note: >-
      "Search engines" and "indexing" appear nowhere in the answering document,
      which says "crawlers" and "access". A paraphrase with almost no lexical
      overlap.
    answer_spans:
      - "These lines indicate whether accessing a URI that matches the corresponding path is allowed or disallowed"
    judgments:
      rfc-9309: 3
      rfc-7725: 1
      rfc-3986: 0

  - id: r20
    family: paraphrase
    text: what part of a web address comes after the hash
    split: dev
    note: '"Web address" for URI, "hash" for the # character and the fragment component.'
    answer_spans:
      - "The fragment identifier component of a URI allows indirect identification of a secondary resource"
    judgments:
      rfc-3986: 3
      rfc-8615: 1
      rfc-6265: 0

  - id: r21
    family: vocabulary-gap
    text: how does a server remember a visitor between page loads
    split: dev
    answer_spans:
      - "To store state, the origin server includes a Set-Cookie header in an HTTP response"
    judgments:
      rfc-6265: 3
      rfc-3986: 0
      rfc-9309: 0

  - id: r22
    family: vocabulary-gap
    text: keeping a cookie from being sent over plain http
    split: dev
    answer_spans:
      - 'The Secure attribute limits the scope of the cookie to "secure" channels'
    judgments:
      rfc-6265: 3
      rfc-7725: 0
      rfc-3986: 0

  - id: r23
    family: plain
    text: what is a name value pair in JSON called
    split: dev
    answer_spans:
      - "An object is an unordered collection of zero or more name/value pairs"
    judgments:
      rfc-8259: 3
      rfc-7159: 2
      rfc-3986: 0

  - id: r24
    family: plain
    text: which specification defines the scheme part of a URI
    split: dev
    answer_spans:
      - "Each URI begins with a scheme name, as defined in Section 3.1"
    judgments:
      rfc-3986: 3
      rfc-8615: 1
      rfc-6585: 0

  - id: r25
    family: plain
    text: user agent line in robots.txt
    split: dev
    answer_spans:
      - 'product token MUST contain only uppercase and lowercase letters'
    judgments:
      rfc-9309: 3
      rfc-6265: 0
      rfc-3986: 0

  - id: r26
    family: paraphrase
    text: conditional request required status code
    split: dev
    note: The paraphrase pair to r17. Same answer, no identifier in the query.
    answer_spans:
      - 'Its typical use is to avoid the "lost update" problem'
    judgments:
      rfc-6585: 3
      rfc-7725: 1
      rfc-9309: 0

  # ---------------------------------------------------------------- test

  - id: r11
    family: plain
    text: is a URI scheme case sensitive
    split: test
    answer_spans:
      - "Although schemes are case- insensitive"
    span_note: >-
      The span contains `case- insensitive`, hyphenated across a line break in
       the original. Week 2's substitution damage, still in the corpus, now lo
      ad-bearing.
    judgments:
      rfc-3986: 3
      rfc-6265: 1
      rfc-8615: 1
      rfc-2324: 0

  - id: r12
    family: negation
    text: when may a crawler ignore robots.txt
    split: test
    note: >-
      Negation. Retrieval has no representation for "ignore" — the answer is in
      RFC 9309 §2.3.1.3, and it is phrased as "MAY access any resources".
    answer_spans:
      - "then the crawler MAY access any resources on the server"
    judgments:
      rfc-9309: 3
      rfc-7725: 0
      rfc-6585: 0

  - id: r13
    family: plain
    text: which status code indicates the client must authenticate to the network
    split: test
    answer_spans:
      - "The 511 status code indicates that the client needs to authenticate to gain network access"
    judgments:
      rfc-6585: 3
      rfc-7725: 1
      rfc-2324: 0

  - id: r14
    family: multi-document
    text: what did RFC 8259 change about JSON
    split: test
    note: >-
      **Needs both documents.** RFC 8259 states the new rule and that it
      obsoletes 7159; RFC 7159 states the old rule. Neither is a 3, because
      neither contains the comparison — the answer exists only across the pair.
      A system that returns one and stops produces a confident half-answer, and
      the metric that catches it is recall, not nDCG.
    answer_spans:
      - "Obsoletes: 7159"
      - "JSON text SHALL be encoded in UTF-8, UTF-16, or UTF-32"
    span_note: >-
      Two spans, in two documents. Neither alone answers the query.
    judgments:
      rfc-8259: 2
      rfc-7159: 2
      rfc-3986: 0
      rfc-6265: 0

  - id: r15
    family: plain
    text: how long may a crawler cache robots.txt
    split: test
    note: RFC 9309 §2.4 — "SHOULD NOT use the cached version for more than 24 hours".
    answer_spans:
      - "SHOULD NOT use the cached version for more than 24 hours"
    span_note: >-
      A 200-token chunker with no overlap cuts this span in half. Nothing at d
      ocument granularity notices.
    judgments:
      rfc-9309: 3
      rfc-6265: 1
      rfc-6585: 0

  - id: r16
    family: paraphrase
    text: brewing coffee over HTTP
    split: test
    answer_spans:
      - "using either the BREW or POST method"
    judgments:
      rfc-2324: 3
      rfc-6585: 0
      rfc-3986: 0
